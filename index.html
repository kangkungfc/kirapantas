<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Log Masuk Aplikasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Memastikan paparan muat 100% skrin telefon tanpa scroll */
    .mobile-screen {
      height: 100dvh;
      max-height: 100dvh;
    }

    /* Penyesuaian automatik untuk telefon skrin pendek (cth: iPhone SE) */
    @media (max-height: 670px) {
      .app-logo {
        width: 96px !important;
        height: 96px !important;
      }
      .header-section {
        padding-top: 0.5rem !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-600 selection:text-white">

  <!-- Container Utama -->
  <main class="mobile-screen w-full max-w-md mx-auto px-6 py-5 flex flex-col justify-between bg-white sm:shadow-xl sm:rounded-3xl sm:my-4 sm:h-[92dvh]">

    <!-- 1. BAHAGIAN LOGO BESAR TERPAMPANG (TANPA KOTAK) -->
    <header class="header-section flex flex-col items-center justify-center pt-5 pb-2">
      <!-- 
        NOTA DEVELOPER: 
        Gantikan elemen <svg> di bawah dengan tag <img> logo rasmi anda (format PNG/SVG lutsinar):
        Contoh: <img src="assets/logo-apps.png" alt="Logo Aplikasi" class="app-logo w-32 h-32 object-contain mb-3">
      -->
      <svg class="app-logo w-32 h-32 mb-3 drop-shadow-sm" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="60" cy="60" r="52" fill="url(#logo_grad)" />
        <path d="M42 62L55 75L80 46" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="logo_grad" x1="15" y1="15" x2="105" y2="105" gradientUnits="userSpaceOnUse">
            <stop stop-color="#4F46E5"/>
            <stop offset="1" stop-color="#7C3AED"/>
          </linearGradient>
        </defs>
      </svg>
      
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">Selamat Kembali</h1>
      <p class="text-xs text-slate-500 mt-1">Sila log masuk untuk meneruskan</p>
    </header>

    <!-- 2. BAHAGIAN BORANG LOG MASUK -->
    <form action="#" method="POST" class="flex flex-col gap-3.5 my-auto">
      
      <!-- Medan E-mel / ID Pengguna -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fa-regular fa-envelope text-base"></i>
        </div>
        <input 
          type="email" 
          required 
          placeholder="E-mel atau No. Telefon" 
          class="w-full pl-10 pr-4 py-3 bg-slate-100/80 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition"
        >
      </div>

      <!-- Medan Kata Laluan -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
          <i class="fa-solid fa-lock text-base"></i>
        </div>
        <input 
          type="password" 
          id="password"
          required 
          placeholder="Kata Laluan" 
          class="w-full pl-10 pr-10 py-3 bg-slate-100/80 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition"
        >
        <button type="button" onclick="togglePassword()" aria-label="Lihat Kata Laluan" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
          <i class="fa-regular fa-eye text-sm" id="eye-icon"></i>
        </button>
      </div>

      <!-- Pilihan Ingat Saya & Lupa Kata Laluan -->
      <div class="flex items-center justify-between text-xs px-1">
        <label class="flex items-center gap-1.5 text-slate-600 cursor-pointer select-none">
          <input type="checkbox" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
          <span>Ingat saya</span>
        </label>
        <a href="#" class="font-medium text-indigo-600 hover:text-indigo-500">Lupa kata laluan?</a>
      </div>

      <!-- Butang Utama -->
      <button 
        type="submit" 
        class="w-full py-3.5 mt-1 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold rounded-xl shadow-md shadow-indigo-200 transition text-sm">
        Log Masuk
      </button>

    </form>

    <!-- 3. BAHAGIAN IKON LOG MASUK PANTAS & DAFTAR -->
    <footer class="pb-1">
      <!-- Garis Pemisah -->
      <div class="relative flex py-2 items-center">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-3 text-[11px] uppercase tracking-wider text-slate-400">Atau teruskan dengan</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <!-- Barisan Ikon Mendatar (Jimat Ruang) -->
      <div class="flex items-center justify-center gap-4 my-2">
        <button type="button" aria-label="Log masuk dengan Google" class="w-12 h-12 rounded-xl border border-slate-200 flex items-center justify-center hover:bg-slate-50 active:scale-95 transition">
          <i class="fa-brands fa-google text-red-500 text-lg"></i>
        </button>
        <button type="button" aria-label="Log masuk dengan Apple" class="w-12 h-12 rounded-xl border border-slate-200 flex items-center justify-center hover:bg-slate-50 active:scale-95 transition">
          <i class="fa-brands fa-apple text-slate-900 text-xl"></i>
        </button>
        <button type="button" aria-label="Log masuk Biometrik" class="w-12 h-12 rounded-xl border border-slate-200 flex items-center justify-center hover:bg-slate-50 active:scale-95 transition">
          <i class="fa-solid fa-fingerprint text-indigo-600 text-xl"></i>
        </button>
      </div>

      <!-- Pautan Daftar -->
      <p class="text-center text-xs text-slate-500 mt-3">
        Tiada akaun lagi? 
        <a href="#" class="font-semibold text-indigo-600 hover:underline">Daftar Sekarang</a>
      </p>
    </footer>

  </main>

  <script>
    function togglePassword() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</body>
</html>
